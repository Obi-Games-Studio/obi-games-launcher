<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Obi Games Launcher</title>
<link rel="icon" href="/logo.png">
<style>
  :root {
    --red: #fe4c3c;
    --ink: #1a0503;
    --bg: #101010;
    --rail: #000;
    --card: #181818;
    --line: rgba(255,255,255,.08);
    --muted: #9a9a9a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #000; color: #fff; }
  body {
    display: flex;
    font: 15px/1.4 "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
  .sr {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); border: 0;
  }
  .rail {
    width: 76px; flex: none; background: var(--rail);
    border-right: 1px solid #161616;
    display: flex; flex-direction: column; align-items: center;
    padding: 18px 0 16px; gap: 18px;
  }
  .rail .logo { width: 46px; height: 46px; object-fit: contain; }
  .rail nav { display: flex; flex-direction: column; gap: 8px; }
  .rail button {
    position: relative; width: 48px; height: 48px; border: 0; border-radius: 14px;
    background: transparent; color: #8d8d8d; display: grid; place-items: center;
  }
  .rail button:hover { color: #fff; background: #141414; }
  .rail button[aria-current="page"] { color: #fff; background: #1a1a1a; }
  .rail button[aria-current="page"]::before {
    content: ""; position: absolute; left: -14px; top: 14px; bottom: 14px;
    width: 3px; border-radius: 2px; background: var(--red);
  }
  .shell { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg); }
  header {
    height: 72px; flex: none; display: flex; align-items: center; justify-content: center;
    position: relative; padding: 0 28px;
  }
  .search {
    width: min(520px, 48vw); height: 40px; display: flex; align-items: center; gap: 8px;
    background: #202020; border: 1px solid transparent; border-radius: 999px; padding: 0 14px;
  }
  .search:focus-within { border-color: #3a3a3a; }
  .search svg { flex: none; color: #8d8d8d; }
  .search input {
    flex: 1; min-width: 0; height: 100%; border: 0; background: transparent; outline: none; padding: 0;
  }
  .search input::placeholder { color: #8d8d8d; }
  .who {
    position: absolute; right: 28px; display: flex; align-items: center; gap: 10px; text-align: right;
  }
  .who strong { display: block; font-size: 13px; font-weight: 650; }
  .who span { display: block; font-size: 11px; color: var(--muted); }
  .who img { width: 36px; height: 36px; border-radius: 50%; background: #000; object-fit: cover; }
  main { flex: 1; overflow: auto; padding: 4px 36px 48px; }
  main::-webkit-scrollbar, .row::-webkit-scrollbar { height: 10px; width: 10px; }
  main::-webkit-scrollbar-thumb, .row::-webkit-scrollbar-thumb { background: #2c2c2c; border-radius: 99px; }
  .hero {
    position: relative; height: 400px; border-radius: 12px; overflow: hidden; cursor: pointer;
    display: flex; align-items: flex-end;
  }
  .hero .shade {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,.05) 10%, rgba(0,0,0,.82) 78%);
  }
  .hero .mark {
    position: absolute; right: -40px; top: -80px; width: 460px; height: 460px;
    object-fit: contain; opacity: .22; pointer-events: none;
  }
  .hero .copy { position: relative; padding: 32px 36px 28px; max-width: 680px; }
  .kicker {
    color: var(--red); font-size: 12px; font-weight: 700; letter-spacing: .16em;
    text-transform: uppercase; margin: 0 0 8px;
  }
  .hero h1 { margin: 0 0 8px; font-size: 52px; line-height: .95; letter-spacing: -.04em; font-weight: 750; }
  .hero p { margin: 0 0 18px; color: #e4e4e4; max-width: 460px; }
  .hero p.lead {
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .hero.has-art { background: #000 right center / auto 100% no-repeat; }
  .hero.has-art .shade {
    background: linear-gradient(90deg, rgba(0,0,0,.82) 0%, rgba(0,0,0,.45) 36%, transparent 58%);
  }
  .play {
    background: var(--red); color: var(--ink); border: 0; border-radius: 4px;
    height: 44px; padding: 0 22px; font-weight: 750; letter-spacing: .01em;
  }
  .play:hover { filter: brightness(1.08); }
  .play:active { filter: brightness(.94); }
  .dots { position: absolute; right: 22px; bottom: 22px; display: flex; gap: 8px; z-index: 1; }
  .dot { width: 8px; height: 8px; border-radius: 99px; border: 0; padding: 0; background: rgba(255,255,255,.4); }
  .dot.on { width: 22px; background: var(--red); }
  .sec { margin: 28px 0 14px; font-size: 22px; letter-spacing: -.02em; font-weight: 700; }
  .hint { margin: -6px 0 18px; color: var(--muted); font-size: 13px; }
  .row { display: flex; gap: 16px; overflow-x: auto; padding: 4px 2px 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(196px, 1fr)); gap: 22px 16px; }
  .card { display: block; width: 196px; flex: none; text-align: left; background: transparent; border: 0; padding: 0; }
  .grid .card { width: auto; }
  .poster {
    position: relative; height: 112px; border-radius: 8px; overflow: hidden;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .poster.tall { height: 262px; }
  .poster.has-art, .banner.has-art {
    background-color: #000; background-repeat: no-repeat; background-position: center; background-size: contain;
  }
  .card:hover .poster { transform: translateY(-4px); box-shadow: 0 14px 36px rgba(254,76,60,.18); }
  .orb {
    position: absolute; width: 150%; height: 70%; left: -20%; bottom: -28%;
    border-radius: 50%; background: rgba(255,255,255,.09);
  }
  .tg {
    position: absolute; left: 12px; top: 12px; font-size: 11px; letter-spacing: .12em;
    text-transform: uppercase; background: rgba(0,0,0,.4); border-radius: 99px; padding: 4px 8px;
  }
  .nm {
    position: absolute; left: 14px; right: 14px; bottom: 12px;
    font-weight: 780; font-size: 22px; letter-spacing: -.03em; line-height: 1.05;
    text-shadow: 0 2px 16px #000;
  }
  .meta { display: flex; justify-content: space-between; gap: 8px; padding: 8px 2px 0; }
  .meta .t { font-size: 14px; font-weight: 650; }
  .free { color: var(--red); font-size: 13px; font-weight: 750; }
  .lib { display: flex; flex-direction: column; gap: 6px; }
  .poster:not(.tall) .nm { font-size: 16px; }
  .lib-row {
    display: grid; grid-template-columns: 188px minmax(0, 1fr) auto; gap: 16px;
    align-items: center; padding: 10px; border-radius: 10px; cursor: pointer; width: 100%;
  }
  .lib-row:hover { background: #171717; }
  .lib-main { min-width: 0; }
  .lib-main .t { font-size: 16px; font-weight: 700; }
  .sub {
    color: var(--muted); font-size: 12px; margin-top: 3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .back {
    background: transparent; border: 0; color: #ddd; padding: 0 0 12px; font-weight: 650;
  }
  .back:hover { color: #fff; }
  .banner { position: relative; height: 300px; border-radius: 12px; overflow: hidden; display: flex; align-items: flex-end; }
  .banner .shade { position: absolute; inset: 0; background: linear-gradient(180deg, transparent, rgba(0,0,0,.8)); }
  .banner .copy { position: relative; padding: 28px; }
  .banner h1 { margin: 0; font-size: 44px; letter-spacing: -.04em; }
  .game-cols { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 28px; align-items: start; margin-top: 22px; }
  .about h1 { margin: 0 0 14px; font-size: 32px; letter-spacing: -.03em; }
  .about h2 { margin: 0 0 8px; font-size: 20px; }
  .about p { margin: 0 0 12px; color: #dedede; max-width: 62ch; }
  .buy { position: sticky; top: 0; background: #161616; border: 1px solid #262626; border-radius: 12px; padding: 16px; }
  .buy .poster.tall { height: 180px; margin-bottom: 4px; }
  .buy .play, .ghost { width: 100%; }
  .buy .play { height: 48px; margin-top: 12px; }
  .ghost {
    height: 36px; margin-top: 8px; background: transparent; color: #ddd;
    border: 1px solid #3a3a3a; border-radius: 4px;
  }
  .ghost:hover { border-color: var(--red); color: #fff; }
  .buy label { display: block; margin-top: 14px; font-size: 12px; color: var(--muted); }
  .buy input {
    width: 100%; margin-top: 6px; background: #101010; border: 1px solid #2c2c2c;
    border-radius: 4px; padding: 10px 12px; font-family: Consolas, ui-monospace, monospace; font-size: 12px;
  }
  .buy input:focus { outline: none; border-color: var(--red); }
  .msg { min-height: 1.2em; margin: 10px 0 0; font-size: 13px; color: var(--red); }
  .msg.ok { color: #dedede; }
  .empty { color: var(--muted); padding: 24px 0; }
  #toast {
    position: fixed; left: 100px; bottom: 24px; max-width: 440px; display: none;
    background: #141414; border: 1px solid var(--red); border-radius: 8px; padding: 12px 14px;
  }
  #toast.show { display: block; }
  @media (max-width: 980px) {
    .game-cols { grid-template-columns: 1fr; }
    .buy { position: static; }
    .who span, .who strong { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
  <aside class="rail">
    <img class="logo" src="/logo.png" alt="Obi Games Studio">
    <nav>
      <button type="button" data-view="home" aria-label="Home" title="Home"></button>
      <button type="button" data-view="store" aria-label="Store" title="Store"></button>
      <button type="button" data-view="library" aria-label="Library" title="Library"></button>
    </nav>
  </aside>
  <div class="shell">
    <header>
      <label class="search">
        <span class="sr">Search games</span>
        <span id="search-icon"></span>
        <input id="q" placeholder="Search" autocomplete="off" spellcheck="false">
      </label>
      <div class="who">
        <div>
          <strong>Obi Games Studio</strong>
          <span>Launcher</span>
        </div>
        <img src="/logo.png" alt="">
      </div>
    </header>
    <main id="view"></main>
  </div>
  <div id="toast" role="status"></div>
<script>
const icons = {
  home: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z"/></svg>',
  store: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h16l-1.2 11H5.2L4 9z"/><path d="M8 9V7a4 4 0 0 1 8 0v2"/></svg>',
  library: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M5 4h3.2v16H5zM10.4 6.5h3.2V20h-3.2zM15.8 5h3.2v15h-3.2z"/></svg>',
  search: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/></svg>'
};
const $ = (s, r = document) => r.querySelector(s);
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}
function color(c, fallback) { return /^#[0-9a-fA-F]{6}$/.test(c || "") ? c : fallback; }
function svg(name) {
  const n = document.createElement("span");
  n.innerHTML = icons[name];
  return n.firstChild;
}

let games = [];
let desktop = false;
let view = "home";
let gameId = "";
let fromView = "home";
let q = "";
let heroIndex = 0;
let toastTimer;

document.querySelectorAll(".rail button").forEach((b) => {
  b.append(svg(b.dataset.view));
  b.addEventListener("click", () => { location.hash = b.dataset.view === "home" ? "home" : b.dataset.view; });
});
$("#search-icon").append(svg("search"));
$("#q").addEventListener("input", () => { q = $("#q").value; render(); });

function toast(text) {
  const t = $("#toast");
  t.textContent = text;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 3400);
}
async function post(url, body) {
  try {
    const r = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body || {})
    });
    const data = await r.json().catch(() => ({}));
    data.ok = r.ok;
    return data;
  } catch (e) {
    return { ok: false, error: "Launcher is not responding." };
  }
}
function matches(g) {
  const s = q.trim().toLowerCase();
  return !s || (g.title + " " + g.tag + " " + g.blurb).toLowerCase().includes(s);
}
function artURL(g) {
  return /^\/[A-Za-z0-9._/-]+$/.test(g.image || "") ? g.image : "";
}
function lead(text) {
  return ((text || "").split(/\n\n/)[0] || "").trim();
}
function poster(g, tall) {
  const d = el("div", "poster" + (tall ? " tall" : ""));
  const url = artURL(g);
  if (url) {
    d.classList.add("has-art");
    d.style.backgroundImage = "url(\"" + url + "\")";
    return d;
  }
  d.style.background = "linear-gradient(165deg, " + color(g.cover && g.cover[0], "#1a0505") + ", " + color(g.cover && g.cover[1], "#fe4c3c") + ")";
  d.append(el("div", "orb"), el("div", "tg", g.tag || "Game"), el("div", "nm", g.title));
  return d;
}
function card(g) {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "card";
  const meta = el("div", "meta");
  meta.append(el("div", "t", g.title), el("div", "free", "Free"));
  b.append(poster(g, true), meta);
  b.addEventListener("click", () => openGame(g.id));
  return b;
}
function openGame(id) {
  fromView = view;
  location.hash = "g/" + encodeURIComponent(id);
}
async function launch(g) {
  if (!desktop) { toast("This preview shows the catalog. Play runs in the desktop launcher."); return; }
  const data = await post("/api/launch", { id: g.id });
  if (!data.ok) { toast(data.error || "Could not start the game"); return; }
  toast("Started " + g.title);
}
function readHash() {
  const h = decodeURIComponent((location.hash || "#home").replace(/^#/, ""));
  if (h.startsWith("g/")) { gameId = h.slice(2); return; }
  gameId = "";
  view = h === "store" || h === "library" ? h : "home";
}
function render() {
  document.querySelectorAll(".rail button").forEach((b) => {
    const on = !q && !gameId && b.dataset.view === view;
    if (on) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
  });
  const root = $("#view");
  root.replaceChildren();
  const shown = games.filter(matches);
  if (q) return results(root, shown);
  if (gameId) return gamePage(root, games.find((g) => g.id === gameId));
  if (view === "store") return store(root, games);
  if (view === "library") return library(root, games);
  home(root, games);
}
function home(root, list) {
  const featured = list.slice(0, 4);
  if (!featured.length) { root.append(el("p", "empty", "No games yet. Edit games.json next to the launcher.")); return; }
  if (heroIndex >= featured.length) heroIndex = 0;
  const g = featured[heroIndex];
  const hero = el("div", "hero");
  const url = artURL(g);
  if (url) {
    hero.classList.add("has-art");
    hero.style.backgroundImage = "url(\"" + url + "\")";
  } else {
    hero.style.background = "linear-gradient(120deg, " + color(g.cover && g.cover[0], "#1a0505") + ", " + color(g.cover && g.cover[1], "#fe4c3c") + ")";
  }
  hero.addEventListener("click", () => openGame(g.id));
  const mark = document.createElement("img");
  mark.className = "mark"; mark.src = "/logo.png"; mark.alt = "";
  const copy = el("div", "copy");
  copy.append(el("p", "kicker", "Obi Games Studio"), el("h1", "", g.title), el("p", "lead", lead(g.blurb)));
  const btn = document.createElement("button");
  btn.type = "button"; btn.className = "play"; btn.textContent = g.exe ? "Play" : "View Game";
  btn.addEventListener("click", (e) => { e.stopPropagation(); g.exe ? launch(g) : openGame(g.id); });
  copy.append(btn);
  const dots = el("div", "dots");
  featured.forEach((item, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "dot" + (i === heroIndex ? " on" : "");
    b.setAttribute("aria-label", item.title);
    b.addEventListener("click", (e) => { e.stopPropagation(); heroIndex = i; render(); });
    dots.append(b);
  });
  hero.append(el("div", "shade"), copy, dots);
  if (!url) hero.insertBefore(mark, hero.firstChild);
  const row = el("div", "row");
  list.forEach((item) => row.append(card(item)));
  root.append(hero, el("h2", "sec", "Studio slate"), row);
}
function store(root) {
  root.append(el("h2", "sec", "Store"));
  const grid = el("div", "grid");
  games.forEach((g) => grid.append(card(g)));
  root.append(grid);
}
function results(root, list) {
  root.append(el("h2", "sec", "Search"));
  if (!list.length) { root.append(el("p", "empty", "No games match.")); return; }
  const grid = el("div", "grid");
  list.forEach((g) => grid.append(card(g)));
  root.append(grid);
}
function library(root) {
  root.append(el("h2", "sec", "Library"), el("p", "hint", "Edit games.json next to this launcher to change the slate. Play runs the .exe you set."));
  const list = el("div", "lib");
  games.forEach((g) => {
    const row = el("div", "lib-row");
    const art = poster(g, false);
    const main = el("div", "lib-main");
    main.tabIndex = 0;
    main.setAttribute("role", "link");
    main.setAttribute("aria-label", g.title);
    main.append(el("div", "t", g.title), el("div", "sub", g.exe ? g.exe : g.tag + " · Not installed"));
    const open = () => openGame(g.id);
    art.addEventListener("click", open);
    main.addEventListener("click", open);
    main.addEventListener("keydown", (e) => { if (e.key === "Enter") open(); });
    const play = document.createElement("button");
    play.type = "button"; play.className = "play"; play.textContent = g.exe ? "Play" : "Locate";
    play.addEventListener("click", () => { g.exe ? launch(g) : open(); });
    row.append(art, main, play);
    list.append(row);
  });
  root.append(list);
}
function gamePage(root, g) {
  const back = document.createElement("button");
  back.type = "button"; back.className = "back"; back.textContent = "Back";
  back.addEventListener("click", () => { location.hash = fromView === "store" ? "store" : fromView === "library" ? "library" : "home"; });
  if (!g) { root.append(back, el("p", "empty", "That game is not in games.json.")); return; }
  const banner = el("div", "banner");
  const url = artURL(g);
  if (url) {
    banner.classList.add("has-art");
    banner.style.backgroundImage = "url(\"" + url + "\")";
  } else {
    banner.style.background = "linear-gradient(120deg, " + color(g.cover && g.cover[0], "#1a0505") + ", " + color(g.cover && g.cover[1], "#fe4c3c") + ")";
    const copy = el("div", "copy");
    copy.append(el("p", "kicker", g.tag || "Game"), el("h1", "", g.title));
    banner.append(el("div", "shade"), copy);
  }
  const about = el("div", "about");
  if (url) about.append(el("h1", "", g.title));
  about.append(el("h2", "", "About"));
  (g.blurb || "").split(/\n\n/).forEach((part) => {
    if (part.trim()) about.append(el("p", "", part.trim()));
  });
  const buy = el("aside", "buy");
  const label = el("label", "", "Game executable");
  const field = document.createElement("input");
  field.spellcheck = false; field.placeholder = "C:\\Games\\YourGame\\YourGame.exe"; field.value = g.exe || "";
  field.setAttribute("aria-label", "Game executable");
  label.append(field);
  const msg = el("p", "msg"); msg.setAttribute("role", "status");
  const play = document.createElement("button");
  play.type = "button"; play.className = "play"; play.textContent = "Play";
  const browse = document.createElement("button");
  browse.type = "button"; browse.className = "ghost"; browse.textContent = "Browse";
  function setMsg(text, ok) { msg.textContent = text || ""; msg.className = ok ? "msg ok" : "msg"; }
  async function save(exe) {
    const data = await post("/api/games/exe", { id: g.id, exe });
    if (!data.ok) { setMsg(data.error || "Could not save"); return false; }
    g.exe = exe; setMsg("Saved.", true); return true;
  }
  field.addEventListener("change", () => { if (field.value.trim()) save(field.value.trim()); });
  browse.addEventListener("click", async () => {
    if (!desktop) { setMsg("Browse and Play run in the desktop launcher."); return; }
    const data = await post("/api/browse", {});
    if (data.path) { field.value = data.path; save(data.path); }
    else if (data.error) setMsg(data.error);
  });
  play.addEventListener("click", async () => {
    if (!desktop) { setMsg("This preview shows the catalog. Play runs in the desktop launcher."); return; }
    const exe = field.value.trim();
    if (!exe) { setMsg("Paste the full path to the game .exe, or browse for it."); return; }
    if (exe !== g.exe && !(await save(exe))) return;
    const data = await post("/api/launch", { id: g.id });
    setMsg(data.ok ? "Started." : (data.error || "Could not start the game"), !!data.ok);
  });
  buy.append(poster(g, true), play, label, browse, msg);
  const cols = el("div", "game-cols");
  cols.append(about, buy);
  root.append(back, banner, cols);
}
addEventListener("hashchange", () => { readHash(); render(); });
addEventListener("keydown", (e) => {
  if (e.key === "Escape" && gameId) location.hash = fromView === "store" ? "store" : fromView === "library" ? "library" : "home";
});
async function boot() {
  try {
    const r = await fetch("/api/games");
    if (r.ok) { games = await r.json(); desktop = true; }
  } catch (e) {}
  if (!Array.isArray(games) || !games.length) {
    try { games = await (await fetch("games.json")).json(); } catch (e) { games = []; }
  }
  if (!Array.isArray(games)) games = [];
  readHash(); render();
  if (!desktop) return;
  const ping = () => fetch("/api/ping", { method: "POST" }).catch(() => {});
  ping(); setInterval(ping, 2000);
}
boot();
</script>
</body>
</html>
